eureka:
  client:
    service-url:
      defaultZone: http://127.0.0.1:8100/eureka
server:
  port: 8080
spring:
  main:
    allow-bean-definition-overriding: true
  application:
    name: app-portal-web
  freemarker:
    cache: false
    charset: UTF-8
    check-template-location: true
    content-type: text/html
    expose-request-attributes: true
    expose-session-attributes: true
    request-context-attribute: request
    suffix: .ftl
    template-loader-path:
      - classpath:/templates
  redis:
    host: 127.0.0.1
    port: 6379
    jedis:
      pool:
        max-idle: 100
        min-idle: 1
        max-active: 1000
        max-wait: -1
xxl:
  sso:
    logout:
      path: /logout
    server: http://taodong.ssoserver.com:8099
xxl-sso:
  excluded:
    paths: /**

ai:
  doubao:
    api-key: ${AI_DOUBAO_API_KEY:your-api-key-here}
    model-id: ep-20260531115448-sgnfq
    api-url: https://ark.cn-beijing.volces.com/api/v3/chat/completions
